plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def soraLocalProperties = new Properties()
def soraLocalPropertiesFile = rootProject.file('local.properties')
if (soraLocalPropertiesFile.exists()) {
    soraLocalPropertiesFile.withInputStream { soraLocalProperties.load(it) }
}
def soraConfigValue = { name, fallback ->
    project.findProperty(name) ?: soraLocalProperties.getProperty(name) ?: System.getenv(name) ?: fallback
}
def soraSupabaseUrl = soraConfigValue('SORA_SUPABASE_URL', 'https://YOUR_PROJECT.supabase.co')
def soraSupabaseAnonKey = soraConfigValue('SORA_SUPABASE_ANON_KEY', 'YOUR_SUPABASE_ANON_KEY')
def soraBackendUrl = soraConfigValue('SORA_BACKEND_URL', 'https://YOUR_BACKEND_HOST/')
def asBuildConfigString = { value -> '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.sora.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.sora.assistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.1"
        buildConfigField 'String', 'SUPABASE_URL', asBuildConfigString(soraSupabaseUrl)
        buildConfigField 'String', 'SUPABASE_ANON_KEY', asBuildConfigString(soraSupabaseAnonKey)
        buildConfigField 'String', 'BACKEND_URL', asBuildConfigString(soraBackendUrl)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Retrofit & OkHttp for SORA Backend API
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
